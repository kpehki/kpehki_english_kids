<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Учимся английскому</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    #catResult {
      position: fixed;
      right: -260px;
      top: 50%;
      transform: translateY(-50%);
      width: 220px;
      background: white;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 15px 30px rgba(0,0,0,0.15);
      opacity: 0;
      transition: all 0.6s ease;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    
    #catResult.show {
      right: 24px;
      opacity: 1;
    }
    
    #catResult img {
      width: 100%;
      animation: bounceIn 0.8s ease;
    }
    
    @keyframes bounceIn {
      0%   { transform: scale(0.5); opacity: 0; }
      60%  { transform: scale(1.1); opacity: 1; }
      100% { transform: scale(1); }
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #f5f7fb;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .card {
      background: white;
      padding: 32px 36px;
      border-radius: 16px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 { margin-top: 0; font-size: 24px; }
    .word { font-size: 32px; font-weight: bold; }
    input { width: 100%; padding: 14px; font-size: 18px; border-radius: 10px; border: 2px solid #ddd; outline: none; margin-bottom: 12px; }
    input.correct { border-color: #4caf50; }
    input.wrong { border-color: #f44336; }
    button { padding: 12px 20px; font-size: 16px; border: none; border-radius: 10px; background: #4f46e5; color: white; cursor: pointer; }
    button:disabled { background: #aaa; }
    .result { font-size: 18px; margin-top: 8px; transition: all 0.3s ease; min-height:24px; }
    .counter, .final-result, #addMsg { font-weight: bold; font-size: 16px; }
    .okBtn, .restartBtn { margin-top: 12px; background: #10b981; }
    #startBtn { background: #3b82f6; color: white; margin-bottom: 8px; display:none; }
    select { padding: 10px; font-size: 16px; border-radius: 10px; border: 2px solid #ddd; margin-bottom: 12px; }
    details summary { cursor:pointer; font-weight:bold; margin-bottom:8px; }
    details div { display: flex; flex-direction: column; gap: 8px; }
    .correct-effect { color: #4caf50; font-size: 24px; transform: scale(1.2); animation: pop 0.3s; }
    @keyframes pop { 0% { transform: scale(1); } 50% { transform: scale(1.4); } 100% { transform: scale(1.2); } }
    .wrong-answer { font-weight: bold; font-size: 22px; color: #f44336; }
    #repeatMistakesBtn { margin-top:8px; background:#f59e0b; }
    @media (max-width: 768px) {
    #catResult {
      right: 50%;
      top: auto;
      bottom: -260px;
      transform: translateX(50%);
      width: 180px;
      padding: 12px;
    }

    #catResult.show {
      bottom: 16px;
      right: 50%;
      opacity: 1;
    }
  }
  </style>
</head>
<body>
  <div id="catResult">
    <img id="catImg" src="" alt="Результат" />
  </div>
  <div class="card">
    <h1>Введи слово по-английски</h1>

    <select id="setSelector"></select>
    <button id="startBtn">🚀 Старт</button>

    <div class="word" id="ruWord"></div>
    <button id="speakBtn">🔊 Произнести слово</button>
    <input id="answer" type="text" placeholder="Напиши перевод" autocomplete="off" />
    <button id="checkBtn">Проверить</button>
    <div class="result" id="result"></div>
    <button id="okBtn" class="okBtn" style="display:none;">ОК</button>
    <button id="restartBtn" class="restartBtn" style="display:none;">Ещё раз все</button>
    <div class="counter" id="counter"></div>
    <div class="final-result" id="finalResult"></div>
    <div id="addMsg" style="color:#059669; min-height:20px;"></div>

    <details>
      <summary>➕ Добавить слово</summary>
      <div>
        <input id="newRu" type="text" placeholder="Слово по-русски" />
        <input id="newEn" type="text" placeholder="Перевод на английском" />
        <button id="addWordBtn">Добавить</button>
      </div>
    </details>
  </div>

  <script>
    const cats = {
      perfect: "cat-happy.png",
      good: "cat-ok.png",
      bad: "cat-sad.png"
    };
    
    const catResult = document.getElementById('catResult');
    const catImg = document.getElementById('catImg');
    function hideCat() {
      catResult.classList.remove('show');
    }
    catResult.addEventListener('click', hideCat);
    const sets = {
      "Еда": [
        { ru: "бургеры", en: "burgers" },
        { ru: "чипсы", en: "chips" },
        { ru: "яблоки", en: "apples" },
        { ru: "сэндвичи", en: "sandwiches" },
        { ru: "бананы", en: "bananas" }
      ],
      "Еда-2": [
        { ru: "мороженое", en: "ice cream" },
        { ru: "пицца", en: "pizza" },
        { ru: "молоко", en: "milk" },
        { ru: "апельсиновый сок", en: "orange juice" },
        { ru: "шоколадный торт", en: "chocolate cake" }
      ],
      "Цифры": [
        { ru: "один", en: "one" },
        { ru: "два", en: "two" },
        { ru: "три", en: "three" },
        { ru: "четыре", en: "four" },
        { ru: "пять", en: "five" },
        { ru: "шесть", en: "six" },
        { ru: "семь", en: "seven" },
        { ru: "восемь", en: "eight" },
        { ru: "девять", en: "nine" },
        { ru: "десять", en: "ten" }
      ],
      "Животные": [
        { ru: "Рыба", en: "fish" },
        { ru: "Птица", en: "bird" },
        { ru: "Лошадь", en: "horse" },
        { ru: "Лягушка", en: "frog" },
        { ru: "Шимпанзе", en: "chimp" }
      ],
      "Действия": [
        { ru: "Плавать", en: "swim" },
        { ru: "Петь", en: "sing" },
        { ru: "Бежать", en: "run" },
        { ru: "Прыгать", en: "jump" },
        { ru: "Танцевать", en: "dance" }
      ],
      "Собрать свой словарь": []
    };

    let words = [];
    let shuffledWords = [];
    let index = 0;
    let correct = 0;
    let currentSet = Object.keys(sets)[0];
    let results = [];

    const setSelector = document.getElementById('setSelector');
    const startBtn = document.getElementById('startBtn');
    const ruWord = document.getElementById('ruWord');
    const answer = document.getElementById('answer');
    const result = document.getElementById('result');
    const counter = document.getElementById('counter');
    const finalResult = document.getElementById('finalResult');
    const checkBtn = document.getElementById('checkBtn');
    const speakBtn = document.getElementById('speakBtn');
    const okBtn = document.getElementById('okBtn');
    const restartBtn = document.getElementById('restartBtn');
    const addMsg = document.getElementById('addMsg');

    const newRu = document.getElementById('newRu');
    const newEn = document.getElementById('newEn');
    const addWordBtn = document.getElementById('addWordBtn');

    function shuffle(array) { return array.sort(() => Math.random() - 0.5); }

    Object.keys(sets).forEach(name => {
      const option = document.createElement('option');
      option.value = name;
      option.textContent = name;
      setSelector.appendChild(option);
    });

    setSelector.addEventListener('change', () => {
      currentSet = setSelector.value;
      words = sets[currentSet];
      addMsg.textContent = '';

      // Сбрасываем тест
      shuffledWords = [];
      index = 0;
      correct = 0;
      results = [];
      finalResult.textContent = '';
      restartBtn.style.display = 'none';
      okBtn.style.display = 'none';
      if (document.getElementById('repeatMistakesBtn')) document.getElementById('repeatMistakesBtn').style.display = 'none';

      if (words.length === 0) {
        ruWord.textContent = "📚 Добавьте слова, чтобы начать тренироваться";
        answer.style.display = 'none';
        checkBtn.style.display = 'none';
        speakBtn.style.display = 'none';
        startBtn.style.display = 'none';
        counter.textContent = '';
      } else {
        startBtn.style.display = 'none';
        shuffledWords = shuffle([...words]);
        results = Array(shuffledWords.length).fill(null);
        showWord();
      }
    });

    startBtn.onclick = () => {
      catResult.classList.remove('show');
      if (words.length === 0) return;
      startBtn.style.display = 'none';
      shuffledWords = shuffle([...words]);
      index = 0;
      correct = 0;
      results = Array(shuffledWords.length).fill(null);
      finalResult.textContent = '';
      addMsg.textContent = '';
      restartBtn.style.display = 'none';
      if (document.getElementById('repeatMistakesBtn')) document.getElementById('repeatMistakesBtn').style.display = 'none';
      showWord();
    };

    function speak(text) {
      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';
      utterance.rate = 0.9;
      speechSynthesis.speak(utterance);
    }

    function showWord() {
      const w = shuffledWords[index];
      ruWord.textContent = w.ru;
      answer.value = '';
      answer.className = '';
      result.textContent = '';
      result.className = 'result';

      if (shuffledWords.length > 0) {
        counter.textContent = `Правильно: ${correct} / ${shuffledWords.length}`;
      } else {
        counter.textContent = '';
      }

      finalResult.textContent = '';
      speakBtn.style.display = 'inline-block';
      answer.style.display = 'block';
      checkBtn.style.display = 'inline-block';
      okBtn.style.display = 'none';
      answer.focus();
      speakBtn.onclick = () => speak(w.en);
    }

    function checkAnswer() {
      const user = answer.value.trim().toLowerCase();
      const correctAnswer = shuffledWords[index].en;
      if (!user) return;
      if (user === correctAnswer) {
        result.textContent = '✅ Правильно!';
        result.classList.add('correct-effect');
        answer.classList.add('correct');
        if (results[index] !== true) correct++;
        results[index] = true;
        setTimeout(nextWord, 1000);
      } else {
        result.innerHTML = `❌ Ошибка. Правильно: <span class='wrong-answer'>${correctAnswer}</span>`;
        answer.classList.add('wrong');
        results[index] = false;
        checkBtn.style.display = 'none';
        okBtn.style.display = 'inline-block';
      }
    }

    function nextWord() {
      index++;
      checkBtn.disabled = false;
      okBtn.style.display = 'none';
      answer.className = '';
      if (index < shuffledWords.length) showWord();
      else showFinalResult();
    }

    function showFinalResult() {
      const percent = Math.round((correct / shuffledWords.length) * 100);
      
      let img = cats.bad;
      if (percent === 100) img = cats.perfect;
      else if (percent >= 70) img = cats.good;
      
      catImg.src = img;
      catResult.classList.add('show');
      ruWord.textContent = '🎉 Готово!';
      answer.style.display = 'none';
      checkBtn.style.display = 'none';
      speakBtn.style.display = 'none';

      let html = `<b>Итог: ${correct} из ${shuffledWords.length}</b><br>`;
      shuffledWords.forEach((w, i) => {
        const mark = results[i] ? '✅' : '❌';
        const color = results[i] ? 'green' : 'red';
        html += `<span style="color:${color}">${mark} ${w.ru} → ${w.en}</span><br>`;
      });
      finalResult.innerHTML = html;

      counter.textContent = '';
      restartBtn.style.display = 'inline-block';
      restartBtn.textContent = 'Ещё раз все';

      if (results.includes(false)) {
        let btn = document.getElementById('repeatMistakesBtn');
        if (!btn) {
          btn = document.createElement('button');
          btn.id = 'repeatMistakesBtn';
          btn.textContent = 'Повторить ошибки';
          btn.className = 'restartBtn';
          btn.style.background = '#f59e0b';
          btn.onclick = repeatMistakes;
          restartBtn.parentNode.insertBefore(btn, restartBtn.nextSibling);
        }
        btn.style.display = 'inline-block';
      }
    }

    function repeatMistakes() {
      catResult.classList.remove('show');
      shuffledWords = shuffledWords.filter((_, i) => results[i] === false);
      results = Array(shuffledWords.length).fill(null);
      index = 0;
      correct = 0;
      finalResult.textContent = '';
      restartBtn.style.display = 'none';
      document.getElementById('repeatMistakesBtn').style.display = 'none';
      showWord();
    }

    addWordBtn.onclick = () => {
      const ru = newRu.value.trim();
      const en = newEn.value.trim().toLowerCase();
      if (!ru || !en) return;
      
      words.push({ ru, en });
      sets[currentSet] = words;
      shuffledWords = shuffle([...words]);
      newRu.value = '';
      newEn.value = '';
      addMsg.textContent = `Слово "${ru} → ${en}" добавлено ✅`;

      if (words.length === 1) {
        startBtn.style.display = 'inline-block';
        ruWord.textContent = '📚 Добавьте слова, чтобы начать тренироваться';
        answer.style.display = 'none';
        checkBtn.style.display = 'none';
        speakBtn.style.display = 'none';
      }
    };

    restartBtn.onclick = () => startBtn.click();
    checkBtn.onclick = checkAnswer;
    okBtn.onclick = nextWord;

    answer.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        if (checkBtn.style.display !== 'none') checkAnswer();
        else if (okBtn.style.display !== 'none') nextWord();
        else if (restartBtn.style.display !== 'none') startBtn.click();
      }
    });

    // стартовый набор
    currentSet = Object.keys(sets)[0];
    words = sets[currentSet];
    setSelector.value = currentSet;

    if (words.length === 0) {
      ruWord.textContent = "📚 Добавьте слова, чтобы начать тренироваться";
      answer.style.display = 'none';
      checkBtn.style.display = 'none';
      speakBtn.style.display = 'none';
      counter.textContent = '';
    } else {
      shuffledWords = shuffle([...words]);
      index = 0;
      correct = 0;
      results = Array(shuffledWords.length).fill(null);
      showWord();
    }
  </script>

</body>
</html>
